name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build agent
        run: dotnet build src/DemoAgent -c Release
      - name: Build Bicep
        run: az bicep build -f infra/main.bicep --stdout > /dev/null
      - name: No GUIDs in appsettings.json
        run: |
          if grep -nE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' src/DemoAgent/appsettings.json; then
            echo "appsettings.json must only contain placeholders"; exit 1
          fi
